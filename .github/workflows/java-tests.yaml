name: Java Tests

on:
  schedule:
    - cron: 0 */6 * * *
  pull_request: {}

jobs:
  java_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Run tests with Gradle
        if: ${{ always() }}
        run: gradle test --project-dir java/gradle
        continue-on-error: true

      - name: Run playwright tests with Maven
        if: ${{ always() }}
        run: mvn test --file java/playwright/pom.xml --quiet
        continue-on-error: true

      - name: Run tests with Maven
        id: run_tests
        if: ${{ always() }}
        run: mvn test --file java/maven/pom.xml --quiet
        continue-on-error: true

      - name: Process test results
        # Run this step even if the test step ahead fails
        if: ${{ always() }}
        uses: trunk-io/analytics-uploader@main
        env:
          TRUNK_PUBLIC_API_ADDRESS: ${{ vars.TRUNK_API_ENDPOINT }}
        with:
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION }}
          # Path to your test results.
          junit-paths: "**/gradle/**/test-results/**/*.xml,**/surefire-reports/*.xml,**/playwright/**/surefire-reports/*.xml"
          # Provide your Trunk organization slug.
          org-slug: ${{ vars.ORG_SLUG }}
          # Provide your Trunk API token as a GitHub secret.
          token: ${{ secrets.TRUNK_PROD_V2_TEST_UPLOAD_TOKEN }}
          # Pass the test outcome for quarantining support
          previous-step-outcome: ${{ steps.run_tests.outcome }}
          test-collection-id: ${{ vars.TEST_COLLECTION_ID }}

      - name: Upload JUnit XML artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-junit-results
          path: |
            **/gradle/**/test-results/**/*.xml
            **/surefire-reports/*.xml
            **/playwright/**/surefire-reports/*.xml
          retention-days: 7
