name: Retryable Tests

on:
  schedule:
    - cron: 0 */6 * * *
  pull_request: {}

jobs:
  retry_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: trunk install
        uses: trunk-io/trunk-action/install@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          tools: gh

      - name: download artifact (when retrying)
        if: ${{ fromJSON(github.run_attempt) > 1}}
        id: download-artifact
        uses: dawidd6/action-download-artifact@a92c7ae74cf1df8810783758581e485ac3aaa309 # v28
        with:
          pr: ${{github.event.pull_request.number}}
          name: retry-data
          workflow_conclusion: ""
          if_no_artifact_found: error

      - name: test
        id: run_tests
        shell: bash
        run: behave --junit-directory=python/results --junit python/behave
        continue-on-error: true

      - name: Process test results
        # Run this step even if the test step ahead fails
        if: ${{ always() }}
        uses: trunk-io/analytics-uploader@main
        env:
          TRUNK_PUBLIC_API_ADDRESS: ${{ vars.TRUNK_API_ENDPOINT }}
        with:
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION }}
          # Path to your test results.
          junit-paths: "**/python/results/*-behave.xml"
          # Provide your Trunk organization slug.
          org-slug: ${{ vars.ORG_SLUG }}
          # Provide your Trunk API token as a GitHub secret.
          token: ${{ secrets.TRUNK_PROD_V2_TEST_UPLOAD_TOKEN }}
          # Pass the test outcome for quarantining support
          previous-step-outcome: ${{ steps.run_tests.outcome }}
          test-collection-id: ${{ vars.TEST_COLLECTION_ID }}

      - name: Upload JUnit XML artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retry-behave-junit-results
          path: "**/python/results/*-behave.xml"
          retention-days: 7

      - name: upload artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retry-data
          path: "**/python/behave/retry.data"
          retention-days: 5

      - name: trigger job re-run
        if: ${{ failure() && steps.run_tests.conclusion == 'failure' && fromJSON(github.run_attempt) < 5}}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: gh workflow run rerun.yaml -F run_id=${{ github.run_id }}
